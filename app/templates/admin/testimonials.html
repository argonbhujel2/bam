{% extends "admin/base.html" %}
{% block title %}Testimonials{% endblock %}
{% block header %}Testimonials{% endblock %}
{% block content %}
<form method="POST" class="form-card" style="margin-bottom:2rem;max-width:640px">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-row">
<div class="form-group"><label>Client name</label><input type="text" name="client_name" required></div>
<div class="form-group"><label>Company</label><input type="text" name="company"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Position (EN)</label><input type="text" name="position_en"></div>
<div class="form-group"><label>Position (NE)</label><input type="text" name="position_ne"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Review (EN)</label><textarea name="review_en"></textarea></div>
<div class="form-group"><label>Review (NE)</label><textarea name="review_ne"></textarea></div>
</div>
<div class="form-row">
<div class="form-group"><label>Rating (1-5)</label><input type="number" name="rating" value="5" min="1" max="5"></div>
<div class="form-group"><label>Order</label><input type="number" name="display_order" value="0"></div>
</div>
<label><input type="checkbox" name="is_active" checked> Active</label>
<button type="submit" class="btn btn-primary" style="margin-top:1rem">Add</button>
</form>
<div class="table-wrap"><table>
<thead><tr><th>Name</th><th>Company</th><th>Rating</th><th></th></tr></thead>
<tbody>
{% for i in items %}
<tr><td>{{ i.client_name }}</td><td>{{ i.company }}</td><td>{{ i.rating }}</td>
<td><form method="POST" action="{{ url_for('admin.testimonial_delete', id=i.id) }}" onsubmit="return confirm('Delete?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-danger">Delete</button></form></td></tr>
{% else %}<tr><td colspan="4" class="empty">No testimonials</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
