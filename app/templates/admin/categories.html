{% extends "admin/base.html" %}
{% block title %}Categories{% endblock %}
{% block header %}Project Categories{% endblock %}
{% block content %}
<form method="POST" class="form-card" style="margin-bottom:2rem;max-width:500px">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>Name (EN)</label><input type="text" name="name_en" required></div>
<div class="form-group"><label>Name (NE)</label><input type="text" name="name_ne"></div>
<div class="form-group"><label>Order</label><input type="number" name="display_order" value="0"></div>
<button type="submit" class="btn btn-primary">Add Category</button>
</form>
<div class="table-wrap">
<table>
<thead><tr><th>Name</th><th>Slug</th><th>Order</th></tr></thead>
<tbody>
{% for c in categories %}
<tr><td>{{ c.name_en }}</td><td>{{ c.slug }}</td><td>{{ c.display_order }}</td></tr>
{% else %}<tr><td colspan="3" class="empty">No categories</td></tr>{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
